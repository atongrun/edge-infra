name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install audit tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck

      - name: Shell syntax
        run: |
          find bin lib scripts tests templates/letsencrypt -type f -print0 \
            | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: shellcheck -x bin/edge-infra lib/common.sh scripts/*.sh tests/*.sh templates/letsencrypt/*

      - name: Repository verification
        run: ./scripts/verify.sh

      - name: Contract tests
        run: ./tests/run.sh
