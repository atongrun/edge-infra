mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

profile:
  store-selected: true

proxies:
  - name: Edge-HY2
    type: hysteria2
    server: ${EDGE_DOMAIN}
    port: 443
    password: ${HY2_PASSWORD}
    sni: ${EDGE_DOMAIN}
    alpn: [h3]
    udp: true
    disable-mtu-discovery: true

  - name: Edge-HY2-Hop
    type: hysteria2
    server: ${EDGE_DOMAIN}
    port: 443
    ports: ${HOP_PORT_START}-${HOP_PORT_END}
    hop-interval: 20
    password: ${HY2_PASSWORD}
    sni: ${EDGE_DOMAIN}
    alpn: [h3]
    udp: true
    disable-mtu-discovery: true

  - name: Edge-Trojan
    type: trojan
    server: ${EDGE_DOMAIN}
    port: ${TROJAN_PORT}
    password: ${TROJAN_PASSWORD}
    sni: ${EDGE_DOMAIN}
    alpn: [http/1.1]
    udp: true
    skip-cert-verify: false

proxy-groups:
  - name: 主链路
    type: fallback
    proxies: [Edge-Trojan, Edge-HY2, Edge-HY2-Hop]
    url: https://www.gstatic.com/generate_204
    interval: 60
    timeout: 5000
    max-failed-times: 2
    lazy: false
    expected-status: 204

rules:
  - DOMAIN-SUFFIX,openai.com,主链路
  - DOMAIN-SUFFIX,chatgpt.com,主链路
  - DOMAIN-SUFFIX,anthropic.com,主链路
  - DOMAIN-SUFFIX,claude.ai,主链路
  - DOMAIN-SUFFIX,github.com,主链路
  - DOMAIN-SUFFIX,githubusercontent.com,主链路
  - DOMAIN-SUFFIX,npmjs.org,主链路
  - DOMAIN-SUFFIX,pypi.org,主链路
  - DOMAIN-SUFFIX,docker.com,主链路
  - DOMAIN-SUFFIX,docker.io,主链路
  - DOMAIN-SUFFIX,x.com,主链路
  - DOMAIN-SUFFIX,twitter.com,主链路
  - DOMAIN-SUFFIX,t.me,主链路
  - DOMAIN-SUFFIX,telegram.org,主链路
  - GEOIP,CN,DIRECT
  - MATCH,主链路
