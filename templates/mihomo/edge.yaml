---
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
# Enable IPv6 routing even while DNS below prefers IPv4 answers.
# DNS ipv6: false alone does not stop native IPv6 traffic bypassing a TUN.
ipv6: true
unified-delay: true
tcp-concurrent: true
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
  inet6-address:
  - fdfe:dcba:9876::1/126
proxies:
- name: DediOne-HY2
  type: hysteria2
  server: ${EDGE_DOMAIN}
  port: 443
  password: ${HY2_PASSWORD}
  sni: ${EDGE_DOMAIN}
  skip-cert-verify: false
  alpn:
  - h3
  udp: true
  disable-mtu-discovery: true
- name: DediOne-Trojan
  type: trojan
  server: ${EDGE_DOMAIN}
  port: ${TROJAN_PORT}
  password: ${TROJAN_PASSWORD}
  sni: ${EDGE_DOMAIN}
  skip-cert-verify: false
  udp: true
- name: DediOne-HY2-Hop
  type: hysteria2
  server: ${EDGE_DOMAIN}
  port: 443
  ports: ${HOP_PORT_START}-${HOP_PORT_END}
  hop-interval: 20
  password: ${HY2_PASSWORD}
  sni: ${EDGE_DOMAIN}
  skip-cert-verify: false
  alpn:
  - h3
  udp: true
  disable-mtu-discovery: true
proxy-groups:
- name: 主链路
  type: fallback
  proxies:
  - DediOne-Trojan
  - DediOne-HY2
  - DediOne-HY2-Hop
  url: https://www.gstatic.com/generate_204
  interval: 30
  timeout: 5000
  max-failed-times: 2
  lazy: false
  expected-status: 204
rules:
- DOMAIN-SUFFIX,openai.com,主链路
- DOMAIN-SUFFIX,chatgpt.com,主链路
- DOMAIN-SUFFIX,oaistatic.com,主链路
- DOMAIN-SUFFIX,oaiusercontent.com,主链路
- DOMAIN-SUFFIX,anthropic.com,主链路
- DOMAIN-SUFFIX,claude.ai,主链路
- DOMAIN-SUFFIX,claude.com,主链路
- DOMAIN-SUFFIX,claudeusercontent.com,主链路
- DOMAIN-SUFFIX,github.com,主链路
- DOMAIN-SUFFIX,githubusercontent.com,主链路
- DOMAIN-SUFFIX,githubassets.com,主链路
- DOMAIN-SUFFIX,npmjs.org,主链路
- DOMAIN-SUFFIX,npmjs.com,主链路
- DOMAIN-SUFFIX,pypi.org,主链路
- DOMAIN-SUFFIX,pythonhosted.org,主链路
- DOMAIN-SUFFIX,docker.com,主链路
- DOMAIN-SUFFIX,docker.io,主链路
- DOMAIN-SUFFIX,dockerusercontent.com,主链路
- DOMAIN-SUFFIX,x.com,主链路
- DOMAIN-SUFFIX,twitter.com,主链路
- DOMAIN-SUFFIX,t.co,主链路
- DOMAIN-SUFFIX,twimg.com,主链路
- DOMAIN-SUFFIX,t.me,主链路
- DOMAIN-SUFFIX,telegram.org,主链路
- DOMAIN-SUFFIX,telegram.me,主链路
- DOMAIN-SUFFIX,telegram-cdn.org,主链路
- DOMAIN-SUFFIX,tdesktop.com,主链路
# Keep local discovery/private destinations local. Public UDP (including
# STUN on arbitrary ports) must precede country-based direct rules.
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
- IP-CIDR,255.255.255.255/32,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- IP-CIDR6,ff00::/8,DIRECT,no-resolve
- NETWORK,udp,主链路
- GEOIP,CN,DIRECT
- MATCH,主链路
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#主链路
  - https://8.8.8.8/dns-query#主链路
  # Bootstrap must not depend on the proxy it is resolving.
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
  # Only destinations intentionally routed DIRECT use these resolvers.
  direct-nameserver:
  - https://dns.alidns.com/dns-query#DIRECT
  - https://doh.pub/dns-query#DIRECT
