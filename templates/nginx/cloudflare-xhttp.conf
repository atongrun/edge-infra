# Separate site file owned by the Cloudflare XHTTP overlay. Do not add the
# existing direct hostnames here; they remain served by their own site file.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${CF_HOSTNAME};

    ssl_certificate /etc/letsencrypt/live/${CF_CERT_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CF_CERT_NAME}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # The XHTTP path is a secret-like component; do not log request URIs.
    access_log off;

    # XHTTP packet-up uses ordinary HTTPS streaming with no CF-only transport.
    location ^~ ${CF_XHTTP_PATH} {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:${CF_XRAY_PORT};
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
