<text x="495" y="370" class="small">Trojan over TLS</text>
<text x="495" y="390" class="small">TCP 8443</text>
<path d="M 856 356 H 920" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 425 462 H 474" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)" stroke-dasharray="7 6"/>
<rect x="476" y="418" width="380" height="88" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/>
<circle cx="503" cy="445" r="15" fill="#0F766E"/><text x="503" y="451" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#FFFFFF">3</text>
<text x="529" y="449" class="heading">DediOne-HY2</text>
<text x="495" y="476" class="small">Hysteria2</text>
<text x="495" y="496" class="small">UDP 443</text>
<path d="M 856 462 H 920" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M 425 568 H 474" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)" stroke-dasharray="7 6"/>
<rect x="476" y="524" width="380" height="88" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/>
<circle cx="503" cy="551" r="15" fill="#0F766E"/><text x="503" y="557" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#FFFFFF">4</text>
<text x="529" y="555" class="heading">DediOne-HY2-Hop</text>
<text x="495" y="582" class="small">Hysteria2 port hopping</text>
<text x="495" y="602" class="small">UDP 20000–20031 → 443</text>
<path d="M 856 568 H 920" fill="none" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M 920 250 V 568 M 920 409 H 966" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#slate-arrow)"/>
