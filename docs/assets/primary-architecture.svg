<text x="1040" y="585" class="small">UDP / QUIC</text>
<text x="48" y="684" class="section">SUBSCRIPTION &amp; MAINTENANCE</text>
<rect x="40" y="704" width="384" height="88" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/>
<text x="60" y="738" class="body">nginx · HTTPS subscription</text>
<text x="60" y="768" class="small">TCP 443 · Import into the client</text>
<rect x="448" y="704" width="384" height="88" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/>
<text x="468" y="738" class="body">vnStat · Traffic accounting</text>
<text x="468" y="768" class="small">Hourly usage and quota headers</text>
<rect x="856" y="704" width="384" height="88" rx="16" fill="#FFFFFF" stroke="#D8E1EB" stroke-width="1.5"/>
<text x="876" y="738" class="body">ACME · Certificate handling</text>
<text x="876" y="768" class="small">HTTP-01 challenge on TCP 80</text>
</svg>
