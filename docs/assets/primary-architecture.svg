<g fill="none" stroke="#475569" stroke-width="2"><circle cx="1091" cy="355" r="22"/><ellipse cx="1091" cy="355" rx="9" ry="22"/><path d="M 1069 355 H 1113 M 1073 345 H 1109 M 1073 365 H 1109"/></g>
<text x="1091" y="405" class="heading" text-anchor="middle">Internet</text>
<text x="1091" y="437" class="small" text-anchor="middle">Shared VPS egress</text>
<text x="1091" y="466" class="small" text-anchor="middle">One active route</text>
<path d="M 993 551 H 1027" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1040" y="557" class="small">TCP</text>
